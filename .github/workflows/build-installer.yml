name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 2.0.0). Leave empty for default.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "2.0.0"
          }
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $ver"

      - name: Publish self-contained TubeTV Desktop (win-x64)
        shell: pwsh
        run: |
          dotnet publish Desktop/TubeTV.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.app_version }} `
            -p:PublishSingleFile=false `
            -o publish/win-x64

      - name: Create portable zip archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/TubeTV-Portable-${{ steps.version.outputs.app_version }}-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zipPath -Force

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $defaultPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH
            } else {
              choco install innosetup -y --no-progress
              echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH
            }
          }

      - name: Build Windows .exe installer with Inno Setup
        shell: pwsh
        run: |
          $publishAbs = (Resolve-Path "publish/win-x64").Path
          $distAbs = (Resolve-Path "dist").Path
          iscc `
            "/DAppVersion=${{ steps.version.outputs.app_version }}" `
            "/DPublishDir=$publishAbs" `
            "/DOutputDir=$distAbs" `
            "installer/TubeTV.iss"

      - name: Upload installer and portable zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TubeTV-Windows-x64-${{ steps.version.outputs.app_version }}
          path: |
            dist/TubeTV-Setup-*-x64.exe
            dist/TubeTV-Portable-*-x64.zip

      - name: Attach binaries to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TubeTV-Setup-*-x64.exe
            dist/TubeTV-Portable-*-x64.zip
